name: checks
on:
  push:
  pull_request:
jobs:
  unittest:
    # SON-6032: self-hosted spark ARC runner (scale set spark-molasp-lab,
# ephemeral pods on spark-4a06, min 0)
    runs-on: spark-molasp-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run lab checks (stdlib only)
        run: python3 -m unittest discover -s tests -v
